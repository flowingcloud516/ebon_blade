[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebon-blade"
version = "0.2.0"
description = "Workspace-based desktop shell for lab environment preparation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.12.0", "asyncssh>=2.21,<3"]

[project.gui-scripts]
ebon-blade = "ebon_blade.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ebon_blade*", "basic_connector*", "env_model*"]
